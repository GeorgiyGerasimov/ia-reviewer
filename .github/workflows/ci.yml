# CI — lint + tests + benchmark gate on every push / PR to main.
#
# Everything in this workflow is hermetic:
#   * no Postgres service (tests mock asyncpg pool/connection)
#   * no live LLM (tests mock ModelFactory; benchmarks use --mock-llm)
#   * no network calls to OSV / GitHub / embedder (all mocked via respx)
#
# Total runtime: ~1 minute. Well under the 2000 min/month free-tier
# budget on private repos.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight CI run when a newer commit lands on the same
# branch — saves minutes on rapid-fire pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests + benchmark gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src/ tests/ main.py benchmarks/

      - name: Pytest (unit + integration + non-playwright e2e)
        # Playwright suite lives in its own directory and has its own
        # CI job below (needs a browser, runs longer). The
        # `--ignore=tests/e2e/playwright` flag below is redundant
        # with the project's default in pyproject.toml's
        # `[tool.pytest.ini_options].addopts`, kept explicit here so
        # this step's intent is obvious without cross-referencing.
        run: pytest -v --tb=short --ignore=tests/e2e/playwright

      # Two benchmark gates. The `judge` and `judge-formatter` suites
      # are intentionally NOT gated here — they're calibration sets
      # that only make sense against a live LLM (mock mode misses
      # every `bad-*` case by design — the miss-count IS the
      # value-add measurement). Run them locally / from a separate
      # workflow if you want to track judge accuracy over time.
      - name: Benchmark — dependency (deterministic, gate at 100%)
        run: python -m benchmarks.run dependency --min-success-rate 1.0

      - name: Benchmark — validator (--mock-llm, pure-code floor 80%)
        run: python -m benchmarks.run validator --mock-llm --min-success-rate 0.80

  web:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Independent of the Python job — a frontend regression should
    # still surface even when the backend job is fine, and vice versa.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (npm ci)
        # `npm ci` honours `package-lock.json` and refuses to mutate
        # it — the exact tree we tested against gets installed.
        run: npm ci
        working-directory: web

      - name: Lint (ESLint, zero warnings)
        run: npm run lint
        working-directory: web

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
        working-directory: web

      - name: Unit + component tests (Vitest)
        run: npm test
        working-directory: web

      - name: Production build (Vite)
        # Build catches type errors that escape the test suite (e.g.
        # CSS-import declarations missing, env-type drift) and proves
        # the bundle is shippable.
        run: npm run build
        working-directory: web

  playwright:
    name: UI e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Don't block on the main `test` job — these are slower (browser
    # startup), and if Playwright is flaky for env reasons we still
    # want the lint+pytest signal to land cleanly. The PR's overall
    # mergeability decision is up to GitHub branch-protection rules.
    needs: []

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install headless Chromium (+ OS deps)
        # `--with-deps` pulls libnss3 / libatk-bridge / fonts / etc.
        # via apt — required on fresh GH runners.
        run: playwright install chromium --with-deps

      - name: Pytest (Playwright suite only)
        # `--reruns 1 --only-rerun TimeoutError` quarantines one class
        # of known browser-startup flake — real bugs still fail
        # deterministically on both attempts. `--screenshot` and
        # `--video` capture artifacts on failure so we don't need to
        # repro locally to debug.
        #
        # `--override-ini='addopts='` clears the default
        # `--ignore=tests/e2e/playwright` set in pyproject.toml.
        # That ignore is what keeps `pytest` (with no args)
        # excluding Playwright by default — see the comment on
        # `[tool.pytest.ini_options].addopts` for the rationale.
        run: |
          pytest tests/e2e/playwright/ -v --tb=short \
            --override-ini='addopts=' \
            --reruns 1 \
            --only-rerun "TimeoutError|Timeout exceeded" \
            --screenshot=only-on-failure \
            --video=retain-on-failure

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7
