[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "ia-reviewer"
version = "0.1.0"
description = "Multi-agent AI code review system for GitHub PRs"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-core>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langfuse>=2.50.0",
    "mcp>=1.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-postgres>=0.0.10",
    "psycopg[binary,pool]>=3.2.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "pyyaml>=6.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests routinely use UPPER_CASE module-level fixtures, may rebind names freely,
# and have long parametrize / assertion strings.
"tests/**" = ["N806", "E501", "SIM117", "SIM105", "SIM108"]
# Prompt-template strings legitimately exceed the 120-char limit on JSON
# schema example lines — agents are mostly natural-language anyway.
"src/agents/dependency.py" = ["E501"]
"src/agents/injection.py" = ["E501"]
"src/agents/owasp.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
