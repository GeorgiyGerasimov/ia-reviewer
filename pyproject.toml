[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "ia-reviewer"
version = "0.1.0"
description = "Multi-agent AI code review system for GitHub PRs"
requires-python = ">=3.11"
# PolyForm Noncommercial 1.0.0 is a source-available license, NOT an
# OSI-approved open source license (it forbids commercial use). PyPI's
# SPDX classifier list doesn't include it, so we declare it as a
# free-form string + point at the LICENSE file. Hatchling tolerates
# both forms; SPDX wants `LicenseRef-` prefix for non-standard licenses.
license = { file = "LICENSE" }
keywords = ["langgraph", "code-review", "security", "ai-agents", "rag"]
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-core>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langfuse>=2.50.0",
    "mcp>=1.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-postgres>=0.0.10",
    "psycopg[binary,pool]>=3.2.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "pyyaml>=6.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    # Tier 3 UI tests (`tests/e2e/playwright/`). Optional locally
    # (skip the dir if you don't want to install Chromium); CI
    # installs the browser via `playwright install chromium --with-deps`.
    "pytest-playwright>=0.5.0",
    # Per-test timeouts (`@pytest.mark.timeout(60)`). Without this the
    # whole pytest run blocks for hours if a hung uvicorn fixture or
    # frozen browser page can't be reaped.
    "pytest-timeout>=2.4.0",
    # Flake quarantine for Playwright: `--reruns 2 --only-rerun ...` re-runs
    # network/race-condition flakes once before failing the build. Real
    # bugs hit the reruns deterministically and still fail.
    "pytest-rerunfailures>=15.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests routinely use UPPER_CASE module-level fixtures, may rebind names freely,
# and have long parametrize / assertion strings.
"tests/**" = ["N806", "E501", "SIM117", "SIM105", "SIM108"]
# Prompt-template strings legitimately exceed the 120-char limit on JSON
# schema example lines — agents are mostly natural-language anyway.
"src/agents/dependency.py" = ["E501"]
"src/agents/injection.py" = ["E501"]
"src/agents/owasp.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# By default the regular suite EXCLUDES Playwright tests. Reasons:
#   1. CI runs them in a dedicated job (`playwright:` in ci.yml) for
#      isolated browser-startup cost and artifact retention.
#   2. Mixing them with the pytest-asyncio function-scoped loop pool
#      is a known plugin-interaction issue — pytest-playwright keeps
#      its own running loop under the greenlet sync API, and any
#      `async def test_*` that pytest-asyncio runs AFTER a Playwright
#      test sees `Runner.run() cannot be called from a running event
#      loop`. The two test styles don't share a session cleanly.
#
# To run the Playwright suite explicitly:
#   pytest tests/e2e/playwright/ --override-ini='addopts='
addopts = "--ignore=tests/e2e/playwright"
# Global timeout — every test that hasn't returned in 120s gets a
# SIGTERM. Playwright fixtures bind ports + run a browser; a hung
# server fixture would otherwise stall CI until the job-level
# `timeout-minutes` fires (10 minutes — much later than we'd want
# to find out). Per-test overrides via `@pytest.mark.timeout(N)`.
timeout = 120
markers = [
    "timeout: per-test wall-clock budget in seconds (pytest-timeout)",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
