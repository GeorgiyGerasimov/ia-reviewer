# nginx config for the frontend container. Two responsibilities:
#
#   1. Serve the Vite-built SPA from /usr/share/nginx/html.
#   2. Reverse-proxy the application paths (HTTP + WebSocket) to the
#      `app` service on the docker-compose network.
#
# Strict separation — this file is the ONLY place the two
# containers know about each other. If you want to deploy backend +
# frontend to different hosts, swap `BACKEND_HOST` here for the new
# address and that's it.

# Docker's embedded DNS for inter-container resolution. The
# `valid=10s` re-resolves the upstream every 10s so a backend
# container restart (with a new IP) is picked up without restarting
# nginx. `ipv6=off` shaves a stray AAAA lookup per request.
resolver 127.0.0.11 valid=10s ipv6=off;

# Map the `Upgrade` request header to a Connection-mode token so
# WebSocket handshakes survive the proxy. Without this nginx
# rewrites Connection to "close" and the WS upgrade fails with 400.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Backend address held in a variable so nginx defers DNS
    # resolution until request time. An `upstream { server X; }`
    # block would force startup-time resolution, which breaks
    # `docker run` of just the web image alone AND breaks recovery
    # when the backend container restarts with a new IP.
    set $backend "http://app:8000";

    # Default doc-root for the SPA bundle.
    root /usr/share/nginx/html;
    index index.html;

    # Standard proxy headers reused by every non-WS proxy block.
    # Variables are evaluated per-request; defining these at
    # server-level via `proxy_set_header` makes them inherit into
    # every `location` below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ─── API surface — proxied to the backend ─────────────────────
    # Each route below mirrors a FastAPI handler. We keep them
    # enumerated explicitly (rather than a single broad regex) so an
    # accidental rename in main.py shows up as a 404 in nginx logs
    # instead of being silently shadowed by the SPA fallback at the
    # bottom of this file.
    location = /health   { proxy_pass $backend; }
    location = /review   { proxy_pass $backend; }
    location /reviews    { proxy_pass $backend; }   # /reviews + /reviews/{tid}/…
    location /reports/   { proxy_pass $backend; }   # Markdown reports
    location /chat/      { proxy_pass $backend; }   # GET /chat/{tid}/history
    location = /img.png  { proxy_pass $backend; }   # Legacy donkey icon

    # ─── WebSocket — `/ws/chat/{thread_id}` ────────────────────────
    # Adds Upgrade + Connection headers + a very long read timeout
    # (reviews are minutes-long; the WS is idle most of that time).
    # Origin is preserved by default → backend's WS_ALLOWED_ORIGINS
    # check sees the browser's origin (e.g. http://localhost:8000),
    # which is what we want.
    location /ws/ {
        proxy_pass $backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # ─── SPA fallback ─────────────────────────────────────────────
    # Anything not matched above is treated as a SPA route.
    # `try_files` first looks for the requested file on disk
    # (Vite's hashed assets, favicon, etc.), then falls back to
    # `index.html`. Client-side routing (if/when we add it) "just
    # works" — `/some/path` returns the SPA shell and React Router
    # picks it up from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
