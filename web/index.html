<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ia-reviewer</title>
    <!--
      Boot script — applies the resolved theme to <html> BEFORE
      stylesheet parsing so the page never flashes the wrong palette.
      Mirrors the resolution logic in src/lib/theme.ts. Kept tiny on
      purpose; localStorage failures (private browsing) silently fall
      through to the system preference.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ia-reviewer-theme");
          if (stored === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            return;
          }
          if (stored === "light") return;
        } catch (_) {}
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
